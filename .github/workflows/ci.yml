name: CI
on:
  push:
    branches: [main, "chore/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy scraper.py tests/
      - name: Unit tests (pytest)
        run: pytest -v
